<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سما محمد العنزي | منظومة سيادة الأعمال</title>
    <style>
        :root { --primary-color: #007bff; --bg-color: #0b0e14; --card-bg: #161b22; --text-color: #e6edf3; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; text-align: center; }
        h1 { color: var(--primary-color); }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; text-decoration: none; font-weight: bold; color: white; transition: 0.3s; box-sizing: border-box; }
        .btn-whatsapp { background-color: #25d366; }
        .btn-email { background-color: var(--primary-color); }
        .ai-box { background: var(--card-bg); padding: 20px; border-radius: 15px; border: 1px solid #30363d; margin-top: 30px; text-align: right; }
        .ai-box h2, .ai-box p { text-align: center; }
        textarea { width: 100%; height: 80px; background: #0d1117; color: white; border: 1px solid #30363d; border-radius: 8px; padding: 10px; margin-top: 10px; box-sizing: border-box; font-family: inherit; resize: vertical; }
        button { background: var(--primary-color); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 10px; width: 100%; font-weight: bold; font-size: 1rem; }
        #response { margin-top: 20px; background: #0d1117; padding: 15px; border-radius: 8px; border-right: 4px solid var(--primary-color); display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>سما محمد العنزي</h1>
        <p>استشارات الحوكمة، تطوير المشاريع، وإعادة هندسة العمليات التشغيلية.</p>

        <a href="https://wa.me/966559611720" class="btn btn-whatsapp" target="_blank">مراسلة عبر الواتساب (0559611720)</a>
        <a href="mailto:sssooo7563@gmail.com" class="btn btn-email">إرسال بريد إلكتروني</a>

        <div class="ai-box">
            <h2>🤖 مساعد المنظومة الذكي</h2>
            <p>اطرح أي سؤال حول الحوكمة، بناء السياسات، أو رفع الكفاءة المؤسسية، وسيجيبك المساعد فوراً!</p>
            <textarea id="question" placeholder="اكتب استشارتك هنا..."></textarea>
            <button onclick="getAnswer()">إرسال السؤال</button>
            <div id="response"></div>
        </div>
    </div>

    <script>
        function getAnswer() {
            const q = document.getElementById('question').value.trim();
            const res = document.getElementById('response');
            
            if(!q) {
                res.style.display = 'block';
                res.innerHTML = 'الرجاء إدخال سؤالك لنتمكن من خدمتك بالشكل الأمثل.';
                return;
            }

            let answer = "";
            const lowerQ = q.toLowerCase();

            if (lowerQ.includes('حوكمة') || lowerQ.includes('سياسات')) {
                answer = "الحوكمة هي العمود الفقري لأي منظومة ناجحة؛ تبدأ بتحديد الصلاحيات وفصل المهام لضمان الشفافية والمساءلة.";
            } else if (lowerQ.includes('مشاريع') || lowerQ.includes('إدارة')) {
                answer = "لتحقيق التميز الريادي في إدارة المشاريع، يجب ربط الأهداف بالنتائج الملموسة ومتابعة دورة حياة المشروع بصرامة.";
            } else if (lowerQ.includes('raci') || lowerQ.includes('صلاحيات')) {
                answer = "تطبيق مصفوفة RACI يتطلب تحديد دقيق: المسؤول عن التنفيذ، المسؤول عن الاعتماد، المستشار، والمطلع.";
            } else if (lowerQ.includes('kpis') || lowerQ.includes('مؤشرات') || lowerQ.includes('أداء')) {
                answer = "بناء مؤشرات الأداء (KPIs) يتطلب ربط الأهداف الاستراتيجية بأرقام واضحة، مع لوحات متابعة (Dashboards) فورية.";
            } else if (lowerQ.includes('bpr') || lowerQ.includes('هندسة') || lowerQ.includes('عمليات')) {
                answer = "إعادة هندسة العمليات (BPR) تعني التخلص من الإجراءات البيروقراطية غير المجدية وتصميم مسارات عمل رشيقة.";
            } else {
                answer = "سؤال جوهري! استشارتك في محلها، ولكل منظومة خصوصيتها التي تتطلب تحليلاً دقيقاً من خبيرة متخصصة.";
            }

            res.innerHTML = "<strong>المساعد الذكي:</strong> " + answer + "<br><br><em>هل ترغب في تعميق هذه الرؤية لمشروعك وتطبيقها باحترافية؟ أنا هنا لتنفيذها معك، تواصل معي مباشرة عبر الواتساب لنبدأ العمل!</em>";
            res.style.display = 'block';
        }
    </script>
</body>
</html>
